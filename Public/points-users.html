<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StreamFusion — Usuarios con puntos</title><link rel="stylesheet" href="/style.css"><style>body{margin:0;min-height:100vh;background:#0a0a0f;color:#f4f4f6;font-family:Inter,system-ui,sans-serif}.wrap{max-width:920px;margin:0 auto;padding:28px}.panel{background:rgba(20,20,29,.94);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:20px;box-shadow:0 20px 70px rgba(0,0,0,.28)}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:18px}.eyebrow{font-size:11px;letter-spacing:.12em;color:#8c82ff;text-transform:uppercase;margin:0 0 6px}.title{margin:0;font-size:28px}.muted{color:#a0a0ac}.toolbar{display:flex;gap:10px;align-items:end;margin-top:14px}.field{flex:1;display:flex;flex-direction:column;gap:7px}.field label{font-size:12px;color:#9c9ca8;text-transform:uppercase;letter-spacing:.08em}.field input{box-sizing:border-box;width:100%;background:#11121a;color:#fff;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:11px 12px;outline:none}.field input:focus{border-color:#7c5cff;box-shadow:0 0 0 3px rgba(124,92,255,.12)}.list{margin-top:18px;display:flex;flex-direction:column;gap:8px;max-height:560px;overflow:auto}.rowp{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.02);border-radius:12px;padding:10px 12px}.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#232332;font-size:11px}.meta small{display:block;color:#8e8e9b;margin-top:2px}.pts{text-align:right;font-weight:800}.pts small{display:block;color:#777789;font-weight:500}.empty{padding:28px;text-align:center;color:#888895}.hint{font-size:12px;color:#8d8d99;margin-top:6px}@media(max-width:700px){.wrap{padding:16px}.toolbar{flex-direction:column;align-items:stretch}}</style>  <link rel="icon" type="image/x-icon" href="/SfIcono.ico">
</head><body><main class="wrap"><header class="top"><div><p class="eyebrow">STREAMFUSION / USUARIOS</p><h1 class="title">Usuarios con puntos</h1><p class="muted">Lista bajo demanda de los saldos de esta cuenta.</p></div></header><section class="panel"><div class="toolbar"><div class="field"><label>Buscar usuario</label><input id="search" placeholder="@uniqueId o nombre" autocomplete="off"></div><button class="btn primary" id="searchBtn">Buscar</button></div><div class="hint">No se carga ninguna lista hasta que hagas una búsqueda.</div><div id="list" class="list"><div class="empty">Busca un usuario para ver su saldo.</div></div></section></main><script>(()=>{const token=()=>localStorage.getItem('sf.token.v3')||'';const api=async(url)=>{const h=new Headers();if(token())h.set('Authorization','Bearer '+token());const r=await fetch(url,{headers:h});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||('HTTP '+r.status));return d};const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const render=users=>{$('list').innerHTML=users.length?users.map(u=>`<div class="rowp"><div class="avatar">${u.avatarUrl?`<img src="${esc(u.avatarUrl)}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`:(u.platform==='twitch'?'TW':'TT')}</div><div class="meta"><strong>${esc(u.displayName||u.username)}</strong><small>${u.platform==='twitch'?'Twitch':'TikTok'} · @${esc(u.username)}</small></div><div class="pts">${Number(u.points||0).toLocaleString('es-PE')}<small>pts</small></div></div>`).join(''):'<div class="empty">No se encontraron usuarios.</div>'};async function search(){try{const q=$('search').value.trim();if(!q){$('list').innerHTML='<div class="empty">Escribe un usuario para buscar.</div>';return;}let users=[];for(const platform of ['tiktok','twitch']){try{const d=await api('/api/points/user?platform='+platform+'&username='+encodeURIComponent(q));if(d.user?.username)users.push(d.user)}catch{}}if(!users.length){const d=await api('/api/points/leaderboard?limit=50&q='+encodeURIComponent(q));users=d.users||[]}render(users)}catch(e){$('list').innerHTML='<div class="empty">No se pudo consultar: '+esc(e.message)+'</div>'}};$('searchBtn').onclick=search;$('search').addEventListener('keydown',e=>{if(e.key==='Enter')search()})})();</script></body></html>
